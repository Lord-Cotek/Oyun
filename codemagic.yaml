workflows:
  # ─────────────────────────────────────────────────────────────────────────
  # Android — builds a signed .aab (Play Store) and .apk. Runs on Linux.
  # ─────────────────────────────────────────────────────────────────────────
  android:
    name: Oyun · Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        # Create this signing identity in Codemagic:
        # Teams → your team → Code signing identities → Android keystores.
        # Name it exactly "oyun_upload_keystore".
        - oyun_upload_keystore
      vars:
        PACKAGE_NAME: "app.cotek.oyun"
      node: 20
    scripts:
      - name: Install JS dependencies
        script: cd mobile && npm ci
      - name: Sync web assets and native plugins
        script: cd mobile && npx cap sync android
      - name: Write Firebase config (native push, optional)
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode \
              > "$CM_BUILD_DIR/mobile/android/app/google-services.json"
            echo "Wrote google-services.json"
          else
            echo "GOOGLE_SERVICES_JSON not set — building without native push."
          fi
      - name: Wire icons and splash (no placeholders)
        script: cd mobile && npx capacitor-assets generate --android
      - name: Write release signing config
        script: |
          # Codemagic exposes the keystore referenced above via these vars.
          cat > "$CM_BUILD_DIR/mobile/android/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build signed release bundle
        script: |
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - tcotek@amrome.com
        notify:
          success: true
          failure: true
      # Uncomment once you've connected a Google Play service account in Codemagic:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal

  # ─────────────────────────────────────────────────────────────────────────
  # iOS — builds a signed .ipa for TestFlight / App Store. Runs on macOS.
  # The iOS native project is generated fresh each build (it isn't committed).
  # ─────────────────────────────────────────────────────────────────────────
  ios:
    name: Oyun · iOS
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Your existing App Store Connect API key in Codemagic
      # (Settings → Integrations → Developer Portal). Key name: "codemagic".
      app_store_connect: codemagic
    environment:
      ios_signing:
        # Manual signing: pair the uploaded certificate (.p12 WITH its private
        # key) to the uploaded provisioning profile — both from Codemagic →
        # Settings → Code signing identities. Reference names must match exactly.
        certificates:
          - certificate: Oyun
        provisioning_profiles:
          - profile: oyun_app_store
      vars:
        BUNDLE_ID: "app.cotek.oyun"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: cd mobile && npm ci
      - name: Add and sync iOS platform
        script: |
          cd mobile
          npx cap add ios 2>/dev/null || true
          npx cap sync ios
      - name: Write Firebase config (native push, optional)
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
              > "$CM_BUILD_DIR/mobile/ios/App/App/GoogleService-Info.plist"
            echo "Wrote GoogleService-Info.plist"
          else
            echo "GOOGLE_SERVICE_INFO_PLIST not set — building without native push."
          fi
      - name: Wire icons and splash (no placeholders)
        script: cd mobile && npx capacitor-assets generate --ios
      - name: Declare no non-exempt encryption (skips export compliance)
        script: |
          PLIST="$CM_BUILD_DIR/mobile/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
      - name: Install CocoaPods
        script: cd mobile/ios/App && pod install
      - name: Set build number
        script: |
          cd mobile/ios/App
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Set up code signing
        script: |
          # The ios_signing block above already fetched your stored distribution
          # certificate ("extrap") and the App Store provisioning profile you
          # created in Apple for this bundle id. Just apply it to the project.
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/mobile/ios/App/App.xcodeproj"
      - name: Build signed IPA
        script: |
          cd mobile/ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - tcotek@amrome.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
