# The same checks the production build runs, on every push and pull request,
# so a mistake is seen on GitHub before anyone tries to deploy it.
# Needs no secrets: nothing here touches a database or sends anything.
name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run -s verify
      - run: npx tsc --noEmit
